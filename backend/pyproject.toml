[project]
name = "numeroflix-backend"
version = "0.1.0"
description = "Private, read-only movie catalog and streaming API"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.20",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

